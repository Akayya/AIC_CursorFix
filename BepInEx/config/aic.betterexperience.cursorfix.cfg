## Settings file was created by plugin BetterExperience Cursor Fix v1.2.0
## Plugin GUID: aic.betterexperience.cursorfix

[General]

## Show a usable mouse pointer while a UnityModBase (BetterExperience) GUI window is open.
# Setting type: Boolean
# Default value: true
Enabled = true

## Also force Cursor.lockState = None while the GUI is open.
# Setting type: Boolean
# Default value: true
AlsoUnlockCursor = true

## While the GUI is open, also hide the game's own drawn cursor sprite (XX.CURS.Gob) so it does not show up next to the system pointer.
# Setting type: Boolean
# Default value: true
HideGameCursor = true

